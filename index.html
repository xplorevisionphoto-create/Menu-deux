    var tabs = STEPS.map(function (s) {
      return '<button class="tab' + (state.step === s[0] ? ' act' : '') + '" data-act="tab" data-v="' + s[0] + '" data-key="tab-' + s[0] + '">' + s[1] + '</button>';
    }).join('');
    var cards = MENU[state.step].map(function (it) {
      var on = isOn(state.step, it.id);
      return '<div class="card' + (on ? ' on' : '') + '"><div class="body">' +
        '<div class="name">' + esc(it.name) + '</div>' +
        '<div class="desc">' + esc(it.desc) + '</div>' +
        '<div class="heat">' + dots(it.heat) + '<span class="lbl">' + HEAT[it.heat] + '</span></div>' +
        '</div><button class="add" data-act="pick" data-v="' + it.id + '" data-key="pick-' + it.id + '" aria-pressed="' + (on ? 'true' : 'false') + '">' + (on ? 'Choisi' : 'Ajouter') + '</button></div>';
    }).join('');
    var label = sum.count > 0 ? 'Voir ma commande · ' + sum.count + ' choix' : 'Voir ma commande';
    return '<div class="tabs">' + tabs + '</div>' +
      '<div class="main"><div class="sec"><div><h2>' + TITLES[state.step] + '</h2><p class="hint">' + HINTS[state.step] + '</p></div>' +
      '<button class="ghost" data-act="surprise" data-key="surprise">Menu surprise</button></div>' + cards + '</div>' +
      '<div class="bar"><button class="cta" data-act="go" data-v="cart" data-key="bar-cart">' + label + '</button></div>';
  }

  function viewCart(sum) {
    function row(step, label, value, emptyText, hasValue) {
      return '<div class="row"><div class="body"><div class="lab">' + label + '</div>' +
        '<div class="val' + (hasValue ? '' : ' empty') + '">' + esc(hasValue ? value : emptyText) + '</div></div>' +
        '<button class="edit" data-act="edit" data-v="' + step + '" data-key="edit-' + step + '">' + (hasValue ? 'Modifier' : (step === 'extra' ? 'Ajouter' : 'Choisir')) + '</button></div>';
    }
    var none = sum.count === 0;
    return '<div class="main">' +
      (state.surprise ? '<div class="banner">Menu surprise tiré au hasard. Changez tout ce qui ne vous tente pas.</div>' : '') +
      row('entree', 'Entrées', names(sum.es).join(', '), 'Pas encore choisies', sum.es.length > 0) +
      row('plat', 'Plats', names(sum.ps).join(', '), 'Pas encore choisis', sum.ps.length > 0) +
      row('extra', 'Extras', names(sum.xs).join(', '), 'Aucun extra', sum.xs.length > 0) +
      '<div class="earn"><span>Points gagnés avec cette commande</span><b>+' + sum.pts + '</b></div>' +
      '<button class="cta" data-act="order" data-key="order"' + (none ? ' disabled' : '') + '>' + (none ? 'Choisissez au moins un élément' : 'Envoyer la commande') + '</button>' +
      '<div class="note"><strong>Le mot d’arrêt</strong><span>Si l’un de vous deux dit « stop » à n’importe quel moment, la commande s’arrête, sans discussion. Chaque extra se propose et se valide à deux.</span></div>' +
      '</div>';
  }

  function viewPoints() {
    var next = null;
    for (var i = 0; i < REWARDS.length; i++) { if (REWARDS[i].cost > state.points) { next = REWARDS[i]; break; } }
    var pct = next ? Math.min(100, Math.round(state.points / next.cost * 100)) : 100;
    var nextText = next ? 'Encore ' + (next.cost - state.points) + ' points pour « ' + next.name + ' »' : 'Toutes les récompenses sont débloquées.';
    var rewards = REWARDS.map(function (r, idx) {
      var locked = state.points < r.cost;
      return '<div class="rw"><div class="body"><div class="name">' + esc(r.name) + '</div><div class="desc">' + esc(r.desc) + '</div><div class="cost">' + r.cost + ' pts</div></div>' +
        '<button class="use" data-act="use" data-v="' + idx + '" data-key="use-' + idx + '"' + (locked ? ' disabled' : '') + '>' + (locked ? 'Encore ' + (r.cost - state.points) + ' pts' : 'Utiliser') + '</button></div>';
    }).join('');
    var reset = state.confirmReset
      ? '<div class="reset"><p class="next">Effacer tous les points de cette carte ?</p><div class="two"><button class="ghost" data-act="reset-no" data-key="reset-no">Annuler</button><button class="danger" data-act="reset-yes" data-key="reset-yes">Oui, effacer</button></div></div>'
      : '<div class="reset"><button class="ghost" data-act="reset-ask" data-key="reset-ask">Remettre les points à zéro</button></div>';
    var install = window.__deferred
      ? '<button class="ghost" data-act="install" data-key="install">Installer sur ce téléphone</button>'
      : '';
    return '<div class="main">' +
      '<div class="pcard"><div class="lab">Ma carte de fidélité</div><div class="big">' + state.points + ' <small>points</small></div>' +
      '<div class="track"><div class="fill" style="width:' + pct + '%"></div></div><div class="next">' + esc(nextText) + '</div></div>' +
      install +
      (state.toast ? '<div class="toast" role="status">' + esc(state.toast) + '</div>' : '') +
      '<div class="h3">Récompenses</div>' + rewards + reset + '</div>';
  }

  function viewHistory() {
    if (!state.history.length) {
      return '<div class="main"><div class="note"><strong>Pas encore de commande</strong><span>Votre première commande apparaîtra ici, avec les points gagnés et les récompenses utilisées.</span></div>' +
        '<button class="cta" data-act="go" data-v="menu" data-key="hist-menu">Composer un menu</button></div>';
    }
    var orders = state.history.filter(function (h) { return h.type === 'order'; }).length;
    var items = state.history.map(function (h) {
      if (h.type === 'reward') {
        return '<div class="hist"><div class="hrow"><span class="when">' + esc(fmt(h.t)) + '</span><span class="pts out">−' + h.cost + ' pts</span></div>' +
          '<div class="hl"><b>Récompense</b>' + esc(h.name) + '</div></div>';
      }
      var lines = '';
      if (h.e.length) { lines += '<div class="hl"><b>Entrées</b>' + esc(h.e.join(', ')) + '</div>'; }
      if (h.p.length) { lines += '<div class="hl"><b>Plats</b>' + esc(h.p.join(', ')) + '</div>'; }
      if (h.x.length) { lines += '<div class="hl"><b>Extras</b>' + esc(h.x.join(', ')) + '</div>'; }
      return '<div class="hist"><div class="hrow"><span class="when">' + esc(fmt(h.t)) + '</span><span class="pts">+' + h.pts + ' pts</span></div>' + lines + '</div>';
    }).join('');
    var clear = state.confirmClearHist
      ? '<div class="reset"><p class="next">Effacer tout l’historique ? Vos points ne changent pas.</p><div class="two"><button class="ghost" data-act="hclear-no" data-key="hclear-no">Annuler</button><button class="danger" data-act="hclear-yes" data-key="hclear-yes">Oui, effacer</button></div></div>'
      : '<div class="reset"><button class="ghost" data-act="hclear-ask" data-key="hclear-ask">Effacer l’historique</button></div>';
    return '<div class="main"><p class="hint">' + orders + (orders > 1 ? ' commandes' : ' commande') + ' au total.</p>' + items + clear + '</div>';
  }

  function viewDone() {
    return '<div class="done">' +
      '<svg width="88" height="88" viewBox="0 0 88 88" fill="none" aria-hidden="true"><circle cx="44" cy="44" r="40" stroke="#E5174F" stroke-width="6"></circle><path d="M27 45l12 12 22-26" stroke="#E5174F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path></svg>' +
      '<h2>Commande envoyée</h2><p>Prenez votre temps, on ne chronomètre rien.</p>' +
      '<div class="pill">+' + state.earned + ' points sur votre carte</div>' +
      '<button class="cta fit" data-act="go" data-v="menu" data-key="again">Retour au menu</button></div>';
  }

  /* ---------- rendu ---------- */

  function render() {
    var app = document.getElementById('app');
    var prevMain = app.querySelector('.main, .done, .intro');
    var prevScroll = prevMain ? prevMain.scrollTop : 0;
    var ae = document.activeElement;
    var focusKey = ae && ae.getAttribute ? ae.getAttribute('data-key') : null;

    var html;
    if (!state.ack) {
      html = viewIntro();
    } else {
      var sum = summary();
      var body = state.screen === 'menu' ? viewMenu(sum)
        : state.screen === 'cart' ? viewCart(sum)
        : state.screen === 'points' ? viewPoints()
        : state.screen === 'history' ? viewHistory()
        : viewDone();
      html = header() + body + nav(sum);
    }
    app.innerHTML = html;

    var sig = (state.ack ? state.screen : 'intro') + ':' + state.step;
    var main = app.querySelector('.main, .done, .intro');
    if (main && sig === lastSig) { main.scrollTop = prevScroll; }
    lastSig = sig;

    if (focusKey) {
      var el = app.querySelector('[data-key="' + focusKey + '"]');
      if (el && !el.disabled) { try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); } }
    }
  }

  /* ---------- actions ---------- */

  function pick(id) {
    state.surprise = false;
    var list = state[SEL[state.step]];
    var i = list.indexOf(id);
    if (i === -1) { list.push(id); } else { list.splice(i, 1); }
    render();
  }

  function surprise() {
    function rnd(list) { return list[Math.floor(Math.random() * list.length)]; }
    state.entrees = [rnd(MENU.entree).id];
    state.plats = [rnd(MENU.plat).id];
    var pool = MENU.extra.slice();
    var n = 1 + Math.floor(Math.random() * 2);
    state.extras = [];
    while (n > 0 && pool.length) {
      state.extras.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0].id);
      n--;
    }
    state.surprise = true;
    state.screen = 'cart';
    render();
  }

  function order() {
    var sum = summary();
    if (sum.count === 0) return;
    state.points += sum.pts;
    state.earned = sum.pts;
    state.history.unshift({ t: Date.now(), type: 'order', e: names(sum.es), p: names(sum.ps), x: names(sum.xs), pts: sum.pts });
    state.history = state.history.slice(0, 200);
    state.entrees = []; state.plats = []; state.extras = [];
    state.step = 'entree'; state.surprise = false; state.toast = '';
    state.screen = 'done';
    save();
    render();
  }

  document.getElementById('app').addEventListener('click', function (ev) {
    var t = ev.target && ev.target.closest ? ev.target.closest('[data-act]') : null;
    if (!t || t.disabled) return;
    var act = t.getAttribute('data-act');
    var v = t.getAttribute('data-v');
    if (act === 'ack') { state.ack = true; save(); render(); }
    else if (act === 'go') { state.screen = v; state.toast = ''; state.confirmReset = false; state.confirmClearHist = false; render(); }
    else if (act === 'tab') { state.step = v; render(); }
    else if (act === 'pick') { pick(v); }
    else if (act === 'edit') { state.screen = 'menu'; state.step = v; render(); }
    else if (act === 'surprise') { surprise(); }
    else if (act === 'order') { order(); }
    else if (act === 'use') {
      var r = REWARDS[parseInt(v, 10)];
      if (r && state.points >= r.cost) {
        state.points -= r.cost;
        state.history.unshift({ t: Date.now(), type: 'reward', name: r.name, cost: r.cost });
        state.history = state.history.slice(0, 200);
        state.toast = '« ' + r.name + ' » utilisé. À vous de jouer.';
        save();
        render();
      }
    }
    else if (act === 'reset-ask') { state.confirmReset = true; render(); }
    else if (act === 'reset-no') { state.confirmReset = false; render(); }
    else if (act === 'reset-yes') { state.points = 0; state.confirmReset = false; state.toast = ''; save(); render(); }
    else if (act === 'hclear-ask') { state.confirmClearHist = true; render(); }
    else if (act === 'hclear-no') { state.confirmClearHist = false; render(); }
    else if (act === 'hclear-yes') { state.history = []; state.confirmClearHist = false; save(); render(); }
    else if (act === 'install') {
      var d = window.__deferred;
      if (d && d.prompt) {
        d.prompt();
        window.__deferred = null;
        render();
      }
    }
  });

  window.addEventListener('installready', render);
  window.addEventListener('installdone', render);

  load();
  render();
})();
</script>

<script>
(function () {
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    window.__deferred = e;
    window.dispatchEvent(new Event('installready'));
  });
  window.addEventListener('appinstalled', function () {
    window.__deferred = null;
    window.dispatchEvent(new Event('installdone'));
  });
})();
</script>
